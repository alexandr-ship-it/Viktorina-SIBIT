<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>СИБИТ Квиз — редактор</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/style.css">
<style>
  .wrap{max-width:860px}
  .meta{padding:22px;display:grid;gap:14px}
  .title-input{font-family:var(--head);font-size:28px;font-weight:600;border:0;border-bottom:2px solid var(--line);border-radius:0;padding:6px 0;outline:none;width:100%;background:transparent}
  .title-input:focus{border-color:var(--blue)}
  .qcard{padding:20px 22px;margin-top:16px;position:relative}
  .qhead{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
  .qnum{font-family:var(--head);font-size:20px;color:#fff;background:var(--blue);border-radius:8px;min-width:36px;height:32px;display:grid;place-items:center;padding:0 8px}
  .qhead .spacer{flex:1}
  .seg{display:inline-flex;border:1.5px solid var(--line);border-radius:10px;overflow:hidden}
  .seg button{border:0;background:#fff;padding:7px 12px;font-size:13px;font-weight:600;cursor:pointer;color:var(--muted)}
  .seg button.on{background:var(--blue);color:#fff}
  .qtext{font-size:17px;font-weight:600}
  .opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
  .opt{display:flex;align-items:center;gap:8px;border:1.5px solid var(--line);border-radius:12px;padding:6px 8px 6px 6px;background:#fff;transition:border-color .15s,background .15s}
  .opt.correct{border-color:var(--ok);background:var(--ok-soft)}
  .opt .swatch{width:30px;height:30px;border-radius:8px;flex:none;color:#fff;font-weight:800;display:grid;place-items:center;font-size:13px}
  .opt input[type=text]{flex:1;border:0;outline:none;background:transparent;padding:6px 2px;min-width:0}
  .mark{flex:none;width:30px;height:30px;border-radius:50%;border:2px solid var(--line);background:#fff;cursor:pointer;display:grid;place-items:center;color:transparent;font-weight:900}
  .mark.sq{border-radius:8px}
  .opt.correct .mark{background:var(--ok);border-color:var(--ok);color:#fff}
  .qfoot{display:flex;gap:14px;align-items:center;margin-top:14px;flex-wrap:wrap}
  .qfoot select{width:auto;padding:7px 10px}
  .qfoot label{font-size:13px;color:var(--muted);font-weight:600;display:flex;align-items:center;gap:6px}
  .img-prev{max-height:160px;max-width:100%;border-radius:10px;margin-top:10px;display:block}
  .savebar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);padding:12px 20px;display:flex;justify-content:center;z-index:30;box-shadow:0 -6px 20px rgba(16,33,70,.06)}
  .savebar .inner{max-width:860px;width:100%;display:flex;gap:10px;align-items:center}
  .savebar .spacer{flex:1}
  .addrow{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap}
  .addrow .btn{flex:1}
  pre.help{background:var(--blue-soft);padding:12px;border-radius:10px;font-size:13px;margin:8px 0 12px;white-space:pre-wrap}
  @media (max-width:640px){.opts{grid-template-columns:1fr}}
</style>
</head>
<body>
<header class="topbar">
  <a class="brand" href="/"><span class="brand-mark">С</span><span class="brand-name">СИБИТ <b>Квиз</b></span></a>
  <span class="spacer"></span>
  <a class="btn btn-onblue btn-sm" href="/">← К викторинам</a>
</header>

<main class="wrap">
  <section class="card meta">
    <input class="title-input" id="title" placeholder="Название викторины" maxlength="120">
    <textarea class="input" id="desc" placeholder="Короткое описание (необязательно)" maxlength="400" rows="2"></textarea>
  </section>
  <div id="questions"></div>
  <div class="addrow">
    <button class="btn btn-blue" id="addQ">+ Добавить вопрос</button>
    <button class="btn btn-ghost" id="bulk">Вставить списком</button>
  </div>
</main>

<div class="savebar"><div class="inner">
  <span class="muted" id="status"></span><span class="spacer"></span>
  <button class="btn btn-ghost" id="saveBtn">Сохранить</button>
  <button class="btn btn-primary" id="saveLaunch">Сохранить и запустить</button>
</div></div>

<div class="modal-back hidden" id="bulkModal">
  <div class="modal" style="max-width:600px">
    <h2>Вставить вопросы списком</h2>
    <p class="muted" style="margin:0">Каждый вопрос — с новой строки, под ним варианты. Верные отметь плюсом, неверные минусом. Между вопросами — пустая строка.</p>
    <pre class="help">Столица России?
+ Москва
- Омск
- Казань

Выбери чётные числа
+ 2
- 3
+ 4</pre>
    <textarea class="input" id="bulkText" rows="10" placeholder="Вставь сюда вопросы…"></textarea>
    <div class="modal-actions">
      <button class="btn btn-ghost" id="bulkCancel">Отмена</button>
      <button class="btn btn-primary" id="bulkAdd">Добавить</button>
    </div>
  </div>
</div>

<script src="/common.js"></script>
<script>
const params = new URLSearchParams(location.search);
let quizId = params.get('id') === 'new' ? null : params.get('id');
let quiz = { title: '', description: '', questions: [] };
let dirty = false;
const L = 'ABCDEF';
const qWrap = document.getElementById('questions');

const blankQ = () => ({ id: Math.random().toString(36).slice(2, 9), text: '', image: '', type: 'single', options: ['', '', '', ''], correct: [0], time: 20, points: 1000 });
const markDirty = () => { dirty = true; document.getElementById('status').textContent = 'Есть несохранённые изменения'; };

function render() {
  qWrap.innerHTML = quiz.questions.map((q, i) => `
    <section class="card qcard" data-i="${i}">
      <div class="qhead">
        <span class="qnum">${i + 1}</span>
        <div class="seg">
          <button data-act="type" data-v="single" class="${q.type === 'single' ? 'on' : ''}">Один ответ</button>
          <button data-act="type" data-v="multi" class="${q.type === 'multi' ? 'on' : ''}">Несколько</button>
        </div>
        <span class="spacer"></span>
        <button class="icon-btn" data-act="up" title="Выше" ${i ? '' : 'disabled'}>↑</button>
        <button class="icon-btn" data-act="down" title="Ниже" ${i < quiz.questions.length - 1 ? '' : 'disabled'}>↓</button>
        <button class="icon-btn" data-act="dup" title="Дублировать">⧉</button>
        <button class="icon-btn" data-act="del" title="Удалить">✕</button>
      </div>
      <textarea class="input qtext" data-f="text" rows="2" placeholder="Текст вопроса" maxlength="500">${esc(q.text)}</textarea>
      <div class="opts">
        ${q.options.map((o, k) => `
          <div class="opt ${q.correct.includes(k) ? 'correct' : ''}">
            <span class="swatch" style="background:var(--opt${k})">${L[k]}</span>
            <input type="text" data-opt="${k}" value="${esc(o)}" placeholder="Вариант ${k + 1}" maxlength="160">
            ${q.options.length > 2 ? `<button class="icon-btn" data-act="rmopt" data-k="${k}" title="Убрать вариант">✕</button>` : ''}
            <button class="mark ${q.type === 'multi' ? 'sq' : ''}" data-act="correct" data-k="${k}" title="Отметить верным">✓</button>
          </div>`).join('')}
      </div>
      <div class="qfoot">
        ${q.options.length < 6 ? `<button class="btn btn-ghost btn-sm" data-act="addopt">+ Вариант</button>` : ''}
        <label>⏱ <select class="input" data-f="time">${[5,10,15,20,30,45,60,90,120].map(t => `<option value="${t}" ${q.time == t ? 'selected' : ''}>${t} сек</option>`).join('')}</select></label>
        <label>★ <select class="input" data-f="points">${[[0,'Без очков'],[500,'500 очков'],[1000,'1000 очков'],[2000,'2000 — двойные']].map(([v,l]) => `<option value="${v}" ${q.points == v ? 'selected' : ''}>${l}</option>`).join('')}</select></label>
        <button class="btn btn-ghost btn-sm" data-act="img">${q.image ? 'Картинка ✓' : '+ Картинка'}</button>
      </div>
      ${q.image ? `<img class="img-prev" src="${esc(q.image)}" alt="" onerror="this.style.display='none'">` : ''}
    </section>`).join('') || `<div class="card qcard muted" style="text-align:center">Добавь первый вопрос</div>`;
}

qWrap.addEventListener('input', e => {
  const card = e.target.closest('.qcard'); if (!card) return;
  const q = quiz.questions[card.dataset.i];
  if (e.target.dataset.f) q[e.target.dataset.f] = e.target.tagName === 'SELECT' ? Number(e.target.value) : e.target.value;
  if (e.target.dataset.opt !== undefined) q.options[e.target.dataset.opt] = e.target.value;
  markDirty();
});

qWrap.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const i = Number(b.closest('.qcard').dataset.i), q = quiz.questions[i], k = Number(b.dataset.k);
  switch (b.dataset.act) {
    case 'type': q.type = b.dataset.v; if (q.type === 'single') q.correct = [q.correct[0] ?? 0]; break;
    case 'correct':
      if (q.type === 'single') q.correct = [k];
      else q.correct = q.correct.includes(k) ? q.correct.filter(x => x !== k) : [...q.correct, k].sort();
      break;
    case 'addopt': q.options.push(''); break;
    case 'rmopt': q.options.splice(k, 1); q.correct = q.correct.filter(x => x !== k).map(x => x > k ? x - 1 : x); if (!q.correct.length) q.correct = [0]; break;
    case 'up': [quiz.questions[i - 1], quiz.questions[i]] = [quiz.questions[i], quiz.questions[i - 1]]; break;
    case 'down': [quiz.questions[i + 1], quiz.questions[i]] = [quiz.questions[i], quiz.questions[i + 1]]; break;
    case 'dup': quiz.questions.splice(i + 1, 0, { ...JSON.parse(JSON.stringify(q)), id: Math.random().toString(36).slice(2, 9) }); break;
    case 'del': quiz.questions.splice(i, 1); break;
    case 'img': {
      const url = prompt('Ссылка на картинку (https://…). Оставь пустым, чтобы убрать.', q.image || '');
      if (url === null) return;
      q.image = url.trim(); break;
    }
  }
  markDirty(); render();
});

document.getElementById('title').oninput = e => { quiz.title = e.target.value; markDirty(); };
document.getElementById('desc').oninput = e => { quiz.description = e.target.value; markDirty(); };
document.getElementById('addQ').onclick = () => {
  quiz.questions.push(blankQ()); markDirty(); render();
  const last = qWrap.lastElementChild; last.scrollIntoView({ behavior: 'smooth', block: 'center' });
  last.querySelector('textarea').focus({ preventScroll: true });
};

// список вопросов из текста
const bulkModal = document.getElementById('bulkModal');
document.getElementById('bulk').onclick = () => { bulkModal.classList.remove('hidden'); document.getElementById('bulkText').focus(); };
document.getElementById('bulkCancel').onclick = () => bulkModal.classList.add('hidden');
document.getElementById('bulkAdd').onclick = () => {
  const blocks = document.getElementById('bulkText').value.split(/\n\s*\n/);
  let added = 0;
  for (const block of blocks) {
    const lines = block.split('\n').map(s => s.trim()).filter(Boolean);
    if (lines.length < 3) continue;
    const q = blankQ(); q.text = lines[0]; q.options = []; q.correct = [];
    for (const line of lines.slice(1, 7)) {
      const m = line.match(/^([+\-*✓✔]|\d+[.)]|[A-Fa-fА-Еа-е][.)])?\s*(.+)$/);
      const mark = m[1] || '';
      if (/^[+*✓✔]$/.test(mark)) q.correct.push(q.options.length);
      q.options.push(m[2]);
    }
    if (q.options.length < 2) continue;
    if (!q.correct.length) q.correct = [0];
    if (q.correct.length > 1) q.type = 'multi';
    quiz.questions.push(q); added++;
  }
  bulkModal.classList.add('hidden'); document.getElementById('bulkText').value = '';
  toast(added ? `Добавлено вопросов: ${added}` : 'Не нашёл вопросов — проверь формат');
  if (added) { markDirty(); render(); }
};

function validate() {
  if (!quiz.title.trim()) return 'Добавь название викторины';
  if (!quiz.questions.length) return 'Добавь хотя бы один вопрос';
  for (const [i, q] of quiz.questions.entries()) {
    if (!q.text.trim()) return `Вопрос ${i + 1}: нет текста`;
    if (q.options.some(o => !o.trim())) return `Вопрос ${i + 1}: заполни все варианты или убери лишние`;
    if (!q.correct.length) return `Вопрос ${i + 1}: отметь верный ответ`;
  }
  return '';
}

async function save() {
  const err = validate(); if (err) { toast(err); return false; }
  try {
    const saved = quizId
      ? await api('/api/quizzes/' + quizId, { method: 'PUT', body: JSON.stringify(quiz) })
      : await api('/api/quizzes', { method: 'POST', body: JSON.stringify(quiz) });
    quizId = saved.id; dirty = false;
    history.replaceState(null, '', '/edit?id=' + encodeURIComponent(quizId));
    document.getElementById('status').textContent = 'Сохранено';
    return true;
  } catch (e) { toast(e.message); return false; }
}
document.getElementById('saveBtn').onclick = async () => { if (await save()) toast('Сохранено'); };
document.getElementById('saveLaunch').onclick = async () => {
  if (!(await save())) return;
  try {
    const { pin, hostToken } = await api('/api/games', { method: 'POST', body: JSON.stringify({ quizId, settings: {} }) });
    location.href = `/host#pin=${pin}&t=${hostToken}`;
  } catch (e) { toast(e.message); }
};
window.addEventListener('beforeunload', e => { if (dirty) { e.preventDefault(); e.returnValue = ''; } });

(async () => {
  if (quizId) {
    try { quiz = await api('/api/quizzes/' + quizId); }
    catch (e) { toast(e.message); quizId = null; }
  }
  if (!quiz.questions.length) quiz.questions.push(blankQ());
  document.getElementById('title').value = quiz.title;
  document.getElementById('desc').value = quiz.description || '';
  render();
  if (!quizId) document.getElementById('title').focus();
})();
</script>
</body>
</html>
