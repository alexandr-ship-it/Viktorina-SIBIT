<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>СИБИТ Квиз — экран ведущего</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/style.css">
<style>
  body{background:var(--blue-deep);color:#fff;min-height:100vh;overflow-x:hidden}
  body::before{content:"";position:fixed;inset:0;background:
    radial-gradient(circle at 92% 8%,rgba(211,47,47,.35) 0,rgba(211,47,47,0) 32%),
    radial-gradient(circle at 0% 100%,rgba(70,120,210,.35) 0,rgba(70,120,210,0) 40%);pointer-events:none}
  .bar{position:relative;display:flex;align-items:center;gap:14px;padding:16px 28px;flex-wrap:wrap}
  .bar .title{font-family:var(--head);font-size:24px;font-weight:600;text-transform:uppercase;letter-spacing:.03em;opacity:.95}
  .bar .spacer{flex:1}
  .stat{background:rgba(255,255,255,.1);border-radius:10px;padding:7px 14px;font-weight:700;font-size:15px;display:flex;gap:8px;align-items:center}
  .stat b{font-family:var(--head);font-size:20px;font-weight:600}
  main{position:relative;padding:0 28px 28px}

  /* лобби */
  .lobby{display:grid;grid-template-columns:minmax(320px,440px) 1fr;gap:28px;align-items:start}
  .join{background:#fff;color:var(--ink);border-radius:22px;padding:26px;text-align:center;box-shadow:0 20px 50px rgba(0,0,0,.3)}
  .join .step{font-size:16px;font-weight:600;color:var(--muted)}
  .join .url{font-family:var(--head);font-size:26px;color:var(--blue);font-weight:600;margin:4px 0 14px;word-break:break-all;text-transform:none}
  .join .qr{width:100%;max-width:330px;aspect-ratio:1;margin:0 auto;display:block;border-radius:12px}
  .join .pin-label{margin-top:14px;font-size:15px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
  .join .pin{font-family:var(--head);font-size:76px;line-height:1;font-weight:700;color:var(--red);letter-spacing:.06em}
  .roster-head{display:flex;align-items:center;gap:16px;margin-bottom:16px;flex-wrap:wrap}
  .roster-head h1{font-size:46px}
  .roster-head .count{font-family:var(--head);font-size:46px;color:#FF8A80;font-weight:600}
  .chips{display:flex;flex-wrap:wrap;gap:10px}
  .chip{background:#fff;color:var(--ink);border-radius:999px;padding:8px 10px 8px 8px;font-weight:700;font-size:18px;display:flex;align-items:center;gap:8px;animation:pop .35s cubic-bezier(.2,1.6,.4,1)}
  .chip .av{font-size:22px;width:34px;height:34px;border-radius:50%;background:var(--blue-soft);display:grid;place-items:center}
  .chip .x{border:0;background:none;color:var(--muted);cursor:pointer;font-size:14px;padding:2px 6px;border-radius:50%;opacity:0;transition:opacity .15s}
  .chip:hover .x{opacity:1}
  .chip.off{opacity:.55}
  .waiting{opacity:.7;font-size:20px;padding:40px 0;display:flex;gap:12px;align-items:center}
  .dots-anim span{display:inline-block;width:10px;height:10px;border-radius:50%;background:#fff;margin:0 3px;animation:blink 1.2s infinite}
  .dots-anim span:nth-child(2){animation-delay:.2s}.dots-anim span:nth-child(3){animation-delay:.4s}
  @keyframes blink{0%,80%,100%{opacity:.2}40%{opacity:1}}
  @keyframes pop{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}
  .start-row{display:flex;gap:12px;margin-top:26px;align-items:center;flex-wrap:wrap}
  .settings{margin-top:22px;background:rgba(255,255,255,.08);border-radius:14px;padding:6px 16px;max-width:560px}
  .settings .switch{color:#fff}
  .settings .switch small{color:rgba(255,255,255,.65)}
  .settings .switch input:checked{background:var(--red)}

  /* лидерборд */
  .live{display:grid;grid-template-columns:1fr 250px;gap:24px;align-items:start}
  .progress-wrap{background:rgba(255,255,255,.12);height:10px;border-radius:999px;overflow:hidden;margin-bottom:18px}
  .progress-wrap i{display:block;height:100%;background:linear-gradient(90deg,#FF8A80,var(--red));border-radius:999px;transition:width .5s ease}
  .board{position:relative}
  .row{display:grid;grid-template-columns:56px 46px minmax(140px,1fr) auto 120px;gap:14px;align-items:center;background:#fff;color:var(--ink);border-radius:14px;padding:10px 16px;margin-bottom:9px;will-change:transform}
  .row .rank{font-family:var(--head);font-size:30px;font-weight:700;color:var(--blue);text-align:center}
  .row .av{font-size:28px;width:44px;height:44px;border-radius:50%;background:var(--blue-soft);display:grid;place-items:center}
  .row .name{font-weight:700;font-size:20px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .row .name small{display:block;font-size:13px;color:var(--muted);font-weight:600}
  .row .score{font-family:var(--head);font-size:30px;font-weight:600;text-align:right;color:var(--blue)}
  .row .qdots{display:flex;gap:4px;flex-wrap:wrap;max-width:360px;justify-content:flex-end}
  .row .qdots i{width:14px;height:14px;border-radius:4px;background:#E2E8F2}
  .row .qdots i.y{background:var(--ok)} .row .qdots i.n{background:var(--red)}
  .row .pbar{width:160px;height:10px;background:#E2E8F2;border-radius:99px;overflow:hidden}
  .row .pbar i{display:block;height:100%;background:var(--ok)}
  .row.top1{background:linear-gradient(90deg,#FFF4D6,#fff)} .row.top1 .rank{color:#C77700}
  .row.top2{background:linear-gradient(90deg,#EEF1F6,#fff)}
  .row.top3{background:linear-gradient(90deg,#FBEBDD,#fff)}
  .row.done .name small{color:var(--ok)}
  .row.off{opacity:.6}
  .streak{font-size:14px;font-weight:800;color:var(--red);margin-left:6px}
  .bump{animation:bump .5s ease}
  @keyframes bump{40%{transform:scale(1.15);color:var(--red)}}
  .side{position:sticky;top:16px;display:flex;flex-direction:column;gap:14px}
  .side .box{background:#fff;color:var(--ink);border-radius:16px;padding:16px;text-align:center}
  .side .box .k{font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
  .side .box .v{font-family:var(--head);font-size:40px;font-weight:600;color:var(--blue);line-height:1.1}
  .side .qr-mini{width:100%;border-radius:8px}
  .side .pin-mini{font-family:var(--head);font-size:34px;color:var(--red);font-weight:700;letter-spacing:.05em}

  /* итоги */
  .podium{display:flex;justify-content:center;align-items:flex-end;gap:18px;margin:10px 0 34px;min-height:360px}
  .place{display:flex;flex-direction:column;align-items:center;width:230px;animation:rise .8s cubic-bezier(.2,1.2,.4,1) both}
  .place .av{font-size:58px;width:96px;height:96px;border-radius:50%;background:#fff;display:grid;place-items:center;box-shadow:0 8px 24px rgba(0,0,0,.25)}
  .place .nm{font-weight:800;font-size:24px;margin:10px 0 2px;text-align:center;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .place .sc{font-family:var(--head);font-size:22px;opacity:.85;margin-bottom:10px}
  .place .step{width:100%;border-radius:14px 14px 0 0;display:grid;place-items:start center;padding-top:14px;font-family:var(--head);font-size:64px;font-weight:700;color:#fff}
  .p1 .step{height:200px;background:linear-gradient(180deg,#E8A317,#C77700)}
  .p2 .step{height:150px;background:linear-gradient(180deg,#9BA8BE,#6E7C95)}
  .p3 .step{height:110px;background:linear-gradient(180deg,#C98454,#9A5A30)}
  .p1{animation-delay:2.5s}.p2{animation-delay:2.05s}.p3{animation-delay:1.6s}
  @keyframes rise{from{transform:translateY(60px);opacity:0}to{transform:none;opacity:1}}
  .results{display:grid;grid-template-columns:1fr 1fr;gap:24px}
  .panel{background:#fff;color:var(--ink);border-radius:16px;padding:20px}
  .panel h2{color:var(--blue);font-size:22px;margin-bottom:12px}
  table{width:100%;border-collapse:collapse;font-size:15px}
  td,th{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left}
  th{font-size:12px;text-transform:uppercase;color:var(--muted);letter-spacing:.05em}
  td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
  .acc{display:inline-block;height:8px;border-radius:9px;background:var(--ok);vertical-align:middle;margin-right:6px}
  .acc.low{background:var(--red)}
  .center{text-align:center}
  .snd-hint{animation:glow 1.6s infinite}
  @keyframes glow{50%{box-shadow:0 0 0 6px rgba(255,138,128,.35)}}
  .err{max-width:520px;margin:12vh auto;text-align:center}
  @media (max-width:900px){.lobby,.live,.results{grid-template-columns:1fr}.side{position:static}.row{grid-template-columns:40px 40px 1fr 90px}.row .qdots,.row .pbar{display:none}.podium{transform:scale(.8);margin:-30px 0 0}}
</style>
</head>
<body>
<div class="bar">
  <a class="brand" href="/" title="К викторинам"><span class="brand-mark">С</span><span class="brand-name">СИБИТ <b>Квиз</b></span></a>
  <span class="title" id="quizTitle"></span>
  <span class="spacer"></span>
  <span class="stat hidden" id="clock">⏱ <b id="clockV">0:00</b></span>
  <span class="stat hidden" id="answersStat">✓ <b id="answersV">0</b></span>
  <button class="btn btn-onblue btn-sm snd-hint" id="sndOn">🔈 Включить звук</button>
  <button class="btn btn-onblue btn-sm hidden" id="musicBtn" title="Музыка"></button>
  <button class="btn btn-onblue btn-sm hidden" id="sfxBtn" title="Звуковые эффекты"></button>
  <button class="btn btn-onblue btn-sm" id="fsBtn">⛶ На весь экран</button>
  <button class="btn btn-primary btn-sm hidden" id="endBtn">Завершить игру</button>
</div>
<main id="app"><div class="waiting">Подключаюсь <span class="dots-anim"><span></span><span></span><span></span></span></div></main>

<script src="/socket.io/socket.io.js"></script>
<script src="/common.js"></script>
<script src="/sound.js"></script>
<script>
const hash = new URLSearchParams(location.hash.slice(1));
let pin = hash.get('pin'), token = hash.get('t');
if (pin && token) { sessionStorage.setItem('sq_host', JSON.stringify({ pin, token })); history.replaceState(null, '', '/host?pin=' + pin); }
else { try { ({ pin, token } = JSON.parse(sessionStorage.getItem('sq_host')) || {}); } catch {} }

const app = document.getElementById('app');
let state = null, view = '', joinUrl = '', clockTimer = null, timeOffset = 0;
const prevScores = new Map();
let knownPlayers = null, lastLeader = null, lastDone = 0;

/* ---------- звук ---------- */
const musicFor = st => st === 'lobby' ? 'lobby' : st === 'live' ? 'game' : null;
Sound.onChange(a => {
  document.getElementById('sndOn').classList.toggle('hidden', a.unlocked);
  ['musicBtn', 'sfxBtn'].forEach(id => document.getElementById(id).classList.toggle('hidden', !a.unlocked));
  document.getElementById('musicBtn').textContent = a.musicOn ? '🎵 Музыка' : '🎵 Выкл';
  document.getElementById('sfxBtn').textContent = a.sfxOn ? '🔊 Звуки' : '🔇 Выкл';
});
document.addEventListener('pointerdown', () => { Sound.unlock(); if (state) Sound.music(musicFor(state.status)); }, { capture: true });
document.getElementById('sndOn').onclick = () => Sound.unlock();
document.getElementById('musicBtn').onclick = () => Sound.setMusic(!Sound.state().musicOn);
document.getElementById('sfxBtn').onclick = () => Sound.setSfx(!Sound.state().sfxOn);

function fail(msg) {
  app.innerHTML = `<div class="err"><h1 style="font-size:40px;margin-bottom:12px">${esc(msg)}</h1><a class="btn btn-white" href="/">К моим викторинам</a></div>`;
}
if (!pin || !token) fail('Игра не найдена');

async function buildJoinUrl() {
  let base = location.origin;
  try {
    const net = await (await fetch('/api/net')).json();
    if (net.publicUrl) base = net.publicUrl;
    else if (/^(localhost|127\.0\.0\.1|\[::1\])$/.test(location.hostname) && net.ips.length)
      base = `${location.protocol}//${net.ips[0]}:${location.port || net.port}`;
  } catch {}
  joinUrl = `${base}/join/${pin}`;
}

const socket = io({ transports: ['websocket', 'polling'] });
socket.on('connect', async () => {
  if (!pin) return;
  if (!joinUrl) await buildJoinUrl();
  socket.emit('host:join', { pin, token }, res => {
    if (res?.error) return fail(res.error);
    update(res.state);
  });
});
socket.on('host:state', update);
socket.on('disconnect', () => toast('Связь с сервером потеряна, переподключаюсь…'));

function update(s) {
  timeOffset = Date.now() - s.now;
  state = s;
  document.getElementById('quizTitle').textContent = s.title;
  document.title = 'СИБИТ Квиз — ' + s.title;
  const v = s.status;
  if (v !== 'ended') Sound.music(musicFor(v));
  const ids = new Set(s.players.map(p => p.id));
  if (knownPlayers && [...ids].some(id => !knownPlayers.has(id))) Sound.sfx('join');
  knownPlayers = ids;
  if (v === 'live') {
    const leader = s.players[0] && s.players[0].score > 0 ? s.players[0].id : null;
    if (lastLeader && leader && leader !== lastLeader) Sound.sfx('rankUp');
    lastLeader = leader;
    const done = s.players.filter(p => p.finished).length;
    if (done > lastDone) Sound.sfx('finished');
    lastDone = done;
  }
  document.getElementById('endBtn').classList.toggle('hidden', v !== 'live');
  document.getElementById('clock').classList.toggle('hidden', v !== 'live');
  document.getElementById('answersStat').classList.toggle('hidden', v !== 'live');
  if (v === 'lobby') renderLobby();
  else if (v === 'live') renderLive();
  else renderEnd();
}

/* ---------- лобби ---------- */
function renderLobby() {
  const s = state;
  if (view !== 'lobby') {
    view = 'lobby';
    const shortUrl = joinUrl.replace(/^https?:\/\//, '').replace(/\/join\/\d+$/, '/play');
    app.innerHTML = `
      <div class="lobby">
        <section class="join">
          <div class="step">Наведи камеру телефона на код</div>
          <img class="qr" src="/api/qr.svg?data=${encodeURIComponent(joinUrl)}" alt="QR-код для входа">
          <div class="step" style="margin-top:14px">или открой</div>
          <div class="url">${esc(shortUrl)}</div>
          <div class="pin-label">Код игры</div>
          <div class="pin">${esc(pin.replace(/(\d{3})(\d{3})/, '$1 $2'))}</div>
        </section>
        <section>
          <div class="roster-head"><h1>Игроки</h1><span class="count" id="pcount">0</span></div>
          <div class="chips" id="chips"></div>
          <div class="start-row">
            <button class="btn btn-primary btn-lg" id="startBtn">▶ Начать игру</button>
            <span id="startHint" style="opacity:.75"></span>
          </div>
          <div class="settings">
            ${[['shuffleQuestions','Перемешать вопросы','У каждого свой порядок'],['showCorrect','Показывать верный ответ','После каждого вопроса'],['speedBonus','Бонус за скорость','Быстрым — больше очков'],['allowLateJoin','Вход после старта','Опоздавшие тоже смогут играть']]
              .map(([k,t,d]) => `<label class="switch"><span>${t}<small>${d}</small></span><input type="checkbox" data-k="${k}" ${s.settings[k] ? 'checked' : ''}></label>`).join('')}
          </div>
        </section>
      </div>`;
    app.querySelector('.settings').onchange = e => socket.emit('host:settings', { [e.target.dataset.k]: e.target.checked });
    document.getElementById('startBtn').onclick = () => socket.emit('host:start', null, r => { if (r?.error) toast(r.error); else Sound.sfx('start'); });
    document.getElementById('chips').onclick = e => {
      const x = e.target.closest('.x'); if (x) socket.emit('host:kick', { id: x.dataset.id });
    };
  }
  document.getElementById('pcount').textContent = s.players.length;
  const chips = document.getElementById('chips');
  const have = new Set([...chips.children].map(c => c.dataset.id));
  const ids = new Set(s.players.map(p => p.id));
  [...chips.children].forEach(c => { if (!ids.has(c.dataset.id)) c.remove(); });
  for (const p of [...s.players].sort((a, b) => a.name.localeCompare(b.name))) {
    let c = chips.querySelector(`[data-id="${p.id}"]`);
    if (!have.has(p.id)) {
      c = document.createElement('div'); c.className = 'chip'; c.dataset.id = p.id;
      c.innerHTML = `<span class="av">${p.avatar}</span><span>${esc(p.name)}</span><button class="x" data-id="${p.id}" title="Убрать игрока">✕</button>`;
      chips.appendChild(c);
    }
    c.classList.toggle('off', !p.connected);
  }
  if (!s.players.length && !chips.querySelector('.waiting'))
    chips.innerHTML = `<div class="waiting">Ждём первых игроков <span class="dots-anim"><span></span><span></span><span></span></span></div>`;
  else if (s.players.length) chips.querySelector('.waiting')?.remove();
  document.getElementById('startBtn').disabled = !s.players.length;
  document.getElementById('startHint').textContent = s.players.length ? `${s.players.length} ${plural(s.players.length, 'игрок готов', 'игрока готовы', 'игроков готовы')}` : '';
}

/* ---------- игра идёт ---------- */
function renderLive() {
  const s = state;
  if (view !== 'live') {
    view = 'live';
    app.innerHTML = `
      <div class="live">
        <section>
          <div class="progress-wrap"><i id="prog" style="width:0"></i></div>
          <div class="board" id="board"></div>
        </section>
        <aside class="side">
          <div class="box"><div class="k">Игроков</div><div class="v" id="sPlayers">0</div></div>
          <div class="box"><div class="k">Закончили</div><div class="v" id="sDone">0</div></div>
          <div class="box"><div class="k">Точность</div><div class="v" id="sAcc">—</div></div>
          ${s.settings.allowLateJoin ? `<div class="box"><div class="k">Опоздал? Заходи</div>
            <img class="qr-mini" src="/api/qr.svg?data=${encodeURIComponent(joinUrl)}" alt="QR-код для входа">
            <div class="pin-mini">${esc(pin.replace(/(\d{3})(\d{3})/, '$1 $2'))}</div></div>` : ''}
        </aside>
      </div>`;
    clearInterval(clockTimer);
    clockTimer = setInterval(tickClock, 500); tickClock();
  }
  const total = s.total, players = s.players;
  const answered = players.reduce((a, p) => a + p.answered, 0);
  const correct = players.reduce((a, p) => a + p.correct, 0);
  document.getElementById('prog').style.width = players.length ? (answered / (players.length * total) * 100) + '%' : '0';
  document.getElementById('sPlayers').textContent = players.length;
  document.getElementById('sDone').textContent = players.filter(p => p.finished).length;
  document.getElementById('sAcc').textContent = answered ? Math.round(correct / answered * 100) + '%' : '—';
  document.getElementById('answersV').textContent = answered;

  const board = document.getElementById('board');
  const before = new Map([...board.children].map(el => [el.dataset.id, el.getBoundingClientRect().top]));
  const ids = new Set(players.map(p => p.id));
  [...board.children].forEach(el => { if (!ids.has(el.dataset.id)) el.remove(); });
  players.forEach((p, i) => {
    let el = board.querySelector(`[data-id="${p.id}"]`);
    if (!el) { el = document.createElement('div'); el.dataset.id = p.id; }
    el.className = 'row' + (i < 3 && p.score > 0 ? ' top' + (i + 1) : '') + (p.finished ? ' done' : '') + (p.connected ? '' : ' off');
    const progress = total <= 30
      ? `<div class="qdots">${p.dots.map(d => `<i class="${d === 1 ? 'y' : d === 0 ? 'n' : ''}"></i>`).join('')}</div>`
      : `<div class="pbar"><i style="width:${p.answered / total * 100}%"></i></div>`;
    el.innerHTML = `<div class="rank">${p.rank}</div><div class="av">${p.avatar}</div>
      <div class="name">${esc(p.name)}${p.streak >= 2 ? `<span class="streak">🔥${p.streak}</span>` : ''}
        <small>${p.finished ? 'Прошёл все вопросы ✓' : `Вопрос ${Math.min(p.answered + 1, total)} из ${total}`}${p.connected ? '' : ' · не в сети'}</small></div>
      ${progress}<div class="score">${p.score.toLocaleString('ru-RU')}</div>`;
    if (prevScores.has(p.id) && prevScores.get(p.id) !== p.score) el.querySelector('.score').classList.add('bump');
    prevScores.set(p.id, p.score);
    board.appendChild(el);
  });
  // плавная перестановка строк
  for (const el of board.children) {
    const old = before.get(el.dataset.id);
    const now = el.getBoundingClientRect().top;
    if (old !== undefined && old !== now) {
      el.animate([{ transform: `translateY(${old - now}px)` }, { transform: 'none' }], { duration: 550, easing: 'cubic-bezier(.2,.8,.2,1)' });
    } else if (old === undefined) {
      el.animate([{ opacity: 0, transform: 'translateX(-20px)' }, { opacity: 1, transform: 'none' }], { duration: 350 });
    }
  }
  if (!players.length) board.innerHTML = `<div class="waiting">Все игроки вышли</div>`;
}
function tickClock() {
  if (!state?.startedAt) return;
  const sec = Math.max(0, Math.floor((Date.now() - timeOffset - state.startedAt) / 1000));
  document.getElementById('clockV').textContent = Math.floor(sec / 60) + ':' + String(sec % 60).padStart(2, '0');
}

document.getElementById('endBtn').onclick = async () => {
  const unfinished = state.players.filter(p => !p.finished).length;
  const ok = await confirmBox('Завершить игру?', unfinished ? `Ещё отвечают: ${unfinished}. Их результат зафиксируется как есть.` : 'Все игроки прошли викторину.', 'Завершить');
  if (ok) socket.emit('host:end');
};

/* ---------- итоги ---------- */
function renderEnd() {
  if (view === 'end') return;
  view = 'end'; clearInterval(clockTimer);
  Sound.music(null);
  Sound.sfx('drumroll');
  const later = [setTimeout(() => Sound.sfx('place'), 1600), setTimeout(() => Sound.sfx('place'), 2050), setTimeout(() => Sound.sfx('fanfare'), 2500)];
  const s = state, top = s.players.slice(0, 3);
  const place = (p, n) => p ? `<div class="place p${n}"><div class="av">${p.avatar}</div><div class="nm">${esc(p.name)}</div>
    <div class="sc">${p.score.toLocaleString('ru-RU')} очков</div><div class="step">${n}</div></div>` : '';
  app.innerHTML = `
    <h1 class="center" style="font-size:52px;margin:6px 0 4px">Итоги</h1>
    <p class="center" style="opacity:.75;margin:0 0 10px">${s.players.length} ${plural(s.players.length, 'участник', 'участника', 'участников')}</p>
    ${top.length ? `<div class="podium">${place(top[1], 2)}${place(top[0], 1)}${place(top[2], 3)}</div>` : ''}
    <div class="results">
      <div class="panel"><h2>Все участники</h2>
        <table><tr><th>#</th><th>Имя</th><th class="num">Верно</th><th class="num">Очки</th></tr>
        ${s.players.map(p => `<tr><td>${p.rank}</td><td>${p.avatar} ${esc(p.name)}</td><td class="num">${p.correct}/${p.total}</td><td class="num"><b>${p.score.toLocaleString('ru-RU')}</b></td></tr>`).join('')}
        </table></div>
      <div class="panel"><h2>Вопросы</h2>
        <table><tr><th>Вопрос</th><th class="num">Верно</th><th class="num">Ср. время</th></tr>
        ${s.qStats.map((q, i) => { const pct = q.answered ? Math.round(q.correct / q.answered * 100) : 0;
          return `<tr><td>${i + 1}. ${esc(q.text)}</td><td class="num"><span class="acc ${pct < 50 ? 'low' : ''}" style="width:${Math.max(4, pct * .5)}px"></span>${pct}%</td><td class="num">${q.avgTime} с</td></tr>`; }).join('')}
        </table></div>
    </div>
    <div class="start-row" style="justify-content:center">
      <button class="btn btn-white" id="csvBtn">⬇ Скачать результаты (Excel/CSV)</button>
      <a class="btn btn-primary" href="/">К моим викторинам</a>
    </div>`;
  document.getElementById('csvBtn').onclick = () => {
    const head = ['Место', 'Имя', 'Очки', 'Верных', 'Всего вопросов', ...s.qStats.map((_, i) => 'В' + (i + 1))];
    const rows = s.players.map(p => [p.rank, p.name, p.score, p.correct, p.total, ...p.dots.map(d => d === 1 ? '1' : d === 0 ? '0' : '')]);
    const csv = '﻿' + [head, ...rows].map(r => r.map(c => `"${String(c).replace(/"/g, '""')}"`).join(';')).join('\r\n');
    downloadFile(`итоги-${s.title}.csv`, csv, 'text/csv;charset=utf-8');
  };
}

document.getElementById('fsBtn').onclick = () => {
  if (document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen?.();
};
</script>
</body>
</html>
